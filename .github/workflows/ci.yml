name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    uses: evolution-gaming/scala-github-actions/.github/workflows/ci.yml@v6
    secrets: inherit
    with:
      scala_versions: '["2.13.16", "3.3.6"]'
      # this repo never collected coverage; enabling it is a separate change
      coverage: false
